name: Verify healthcare map
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check assets/js/healthcare-map.js
      - run: node --check assets/js/neon-data.js
      - run: node --check assets/js/world-map.js
      - run: node --check assets/js/world-data.js
      - run: node --check assets/js/world-geo.js
      - run: node --check assets/js/world-colors.js
      - run: node --check assets/js/world-labels.js
      - run: node --check assets/js/world-catalog.js
      - run: node --check assets/js/world-config.js
      - run: node --check assets/js/registry-data.js
      - run: node --check worker/src/index.js
