<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050c19">
  <title>U.S. Healthcare Facility Map</title>
  <link rel="stylesheet" href="/assets/css/healthcare.css">
</head>
<body>
  <header class="topbar">
    <strong>Healthcare Facility Map</strong>
    <nav aria-label="Map navigation">
      <button id="home" type="button">United States</button>
      <span id="breadcrumb" aria-live="polite"></span>
      <a href="/admin.html" class="toplink">Import facilities</a>
    </nav>
  </header>
  <main>
    <section class="mapArea" aria-label="Healthcare map">
      <div class="controls">
        <label for="category">Facility type</label>
        <select id="category"><option value="">All healthcare facilities</option></select>
        <button id="back" type="button" hidden>Back to United States</button>
      </div>
      <svg id="mapSvg" role="group" aria-label="Interactive map: select a U.S. state, then a county"></svg>
      <div id="status" role="status">Loading map…</div>
    </section>
    <aside class="facilities" aria-labelledby="facilitiesTitle">
      <h1 id="facilitiesTitle">Healthcare facilities</h1>
      <p id="subtitle">Select a state and county to view facilities stored in the database.</p>
      <div id="facilityList" aria-live="polite"></div>
      <button id="loadMore" type="button" hidden>Load more facilities</button>
    </aside>
  </main>
  <script src="/assets/vendor/d3.min.js"></script>
  <script src="/assets/vendor/topojson-client.min.js"></script>
  <script src="/assets/vendor/us-atlas-counties-albers-10m.js"></script>
  <script type="module" src="/assets/js/healthcare-map.js"></script>
</body>
</html>
