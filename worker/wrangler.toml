# Cloudflare Worker: national registries and persistent logos in two separate Neon projects.
# Deploy only after owner approval:  cd worker && npx wrangler deploy
name = "healthcare-directory-api"
main = "src/index.js"
compatibility_date = "2026-10-25"
workers_dev = true
# FRONTEND_ORIGIN is configured in the Cloudflare dashboard; keep dashboard variables on deploy.
keep_vars = true

[observability]
enabled = true

# Secrets are NOT stored here. Add them with:
#   npx wrangler secret put ESANTE_API_KEY
# or in the dashboard: Workers & Pages → healthcare-directory-api → Settings → Variables and Secrets.

[triggers]
crons = ["* * * * *"]
